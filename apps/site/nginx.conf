# Serve a exportação estática do site (apps/site/out) atrás do Traefik, que já termina o HTTPS.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # O manifest dos frames não tem hash no nome: sempre revalidar. Os frames e pôsteres são pedidos com ?v=<versão>
    # (muda se qualquer byte mudar, ver scripts/lib/frames-version.ts), por isso podem ficar imutáveis.
    location ~* ^/frames/.+/manifest\.json$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Frames dos vídeos (versionados por ?v=) e arquivos com hash do build: cache de um ano, imutável.
    location /frames/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Fontes e logos: cache longo, mas revalidável.
    location ~* ^/(fonts|brand)/ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # HTML e o resto: nunca em cache, para um deploy novo aparecer na hora. URLs limpas (/privacidade → privacidade.html).
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
